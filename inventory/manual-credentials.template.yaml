# Manual credential inventory (ticket P0.1): credentials a workflow scan cannot see.
# Copy to manual-credentials.yaml, or start from the file written by
# `scan_workflows.py --credentials-seed`, and validate with:
#   python3 inventory/validate.py credentials manual-credentials.yaml
#
# Record names, scopes and locations only. Never put a credential value here.
# The validator rejects values shaped like tokens or private keys.
#
# kind:         pat | deploy-key | github-app-private-key | model-api-key
#               | cloud-key | workflow-token | other
# broad:        true, false, or TBD until the real scope has been checked.
#               Treat a credential as broad if it reaches more than the agent
#               needs: classic PATs, admin or workflow scope, or several repos.
# removal_date: required when broad is true (YYYY-MM-DD). Use N/A when not broad.
schema_version: 1

# Ticket P0.1 needs a security review of the finished inventory.
security_review:
  reviewer: TBD
  date: TBD

credentials:
  - id: example-agent-pat              # replace: the name you know it by
    kind: pat
    holder: TBD                        # agent, bot account or person using it
    owner: TBD                         # person or team accountable for it
    scope: TBD                         # for example: classic PAT, repo + workflow
    broad: TBD
    where_held: TBD                    # for example: developer laptop, CI org secret
    removal_date: TBD
    notes: Find these in org PAT settings; see README.md.

  - id: example-deploy-key
    kind: deploy-key
    holder: TBD
    owner: TBD
    scope: TBD                         # repo name, and read-only or read-write
    broad: TBD
    where_held: TBD
    removal_date: TBD

  - id: example-github-app-private-key
    kind: github-app-private-key
    holder: TBD
    owner: TBD
    scope: TBD                         # app permissions and installed repos
    broad: TBD
    where_held: TBD
    removal_date: TBD

  - id: example-model-api-key
    kind: model-api-key
    holder: TBD
    owner: TBD
    scope: TBD                         # provider, project or workspace, spend limit
    broad: TBD
    where_held: TBD
    removal_date: TBD
