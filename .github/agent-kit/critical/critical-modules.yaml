# Critical modules for mutation testing (P2.6) and held-out tests (P2.10), for
# owxyz/agent-kit-sandbox. Under CODEOWNERS, so a PR can't lower its own floor.
version: 1

mutation:
  mode: warn            # warn: alerts only. block: the nightly job also fails.
  alert:
    channel: log        # alerts go to the nightly run's log and summary

modules:
  - name: calc
    language: python
    owner: "@Yimunan"
    paths: [calc.py]
    # null means measuring only. Set from measured scores; see README.
    floor: null
    test_command: python -m pytest tests/test_calc.py -x -q

heldout:
  mode: block
  suites:
    - module: calc
      framework: pytest
      # The same python:3.12-slim digest the runtime's agent image uses.
      image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
      tests_path: calc          # directory in owxyz/heldout-tests
      source_root: .            # calc.py sits at the repo root
      adapter:
        import: calc
        exports: [add, abs_diff]
      # The suite has 18 tests; fewer means tests were lost.
      min_tests: 18
      timeout_seconds: 600
      tools_install: pip install --no-cache-dir --target /tools pytest==9.2.0 hypothesis==6.170.15
      # calc.py has no dependencies, so there's no deps_install.
