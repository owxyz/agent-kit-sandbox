# Install as .github/dependabot.yml (P0.7). Dependabot updates the commit SHA
# and the version comment on pinned actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies

  # The coding agent's CLI is in its runtime image, not a manifest here. Its exact
  # version is watched in owxyz/ci-cd-for-coding-agents (runtime/sandbox/docker/agent-cli/, R1.3).

  - package-ecosystem: pip
    directory: /.github/agent-kit
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
