# Required check `provenance` (ticket P1.4).
#
# Uses pull_request_target on purpose: the workflow and script come from the
# base branch, so a PR cannot edit its own check. PR text is parsed only as
# data. It never checks out or runs PR code, and it has no secrets.
name: agent-provenance

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:

permissions: {}

jobs:
  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Pass in the merge queue
        if: github.event_name == 'merge_group'
        run: echo "Provenance was checked on the pull request."

      - name: Check out base-branch scripts
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted
          persist-credentials: false

      - name: Check provenance
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_BOT_LOGINS: ${{ vars.AGENT_BOT_LOGINS }}
        run: >-
          python3 .trusted/.github/agent-kit/scripts/check_provenance.py
          --event "$GITHUB_EVENT_PATH" --agent-logins "$AGENT_BOT_LOGINS"
          --github-output "$GITHUB_OUTPUT"
