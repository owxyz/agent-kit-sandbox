# Claude Code in the sandbox (GA-17; plan section 6.1). Built from
# agent-sandbox.example.yml. Install as .github/workflows/agent-claude-code.yml,
# with this runtime/ folder at .github/agent-kit/runtime/.
#
# Two modes, both started by hand from the default branch:
#   - new task: `issue` and `task`. The agent opens one PR for the issue.
#   - re-dispatch: `pr` (and an optional `note`). The agent pushes to its own
#     PR's existing branch; the pre-flight gets the PR as target-pr.
#
# The job token only reads. The App token, minted per run and revoked at the
# end, is the only GitHub write credential, and the agent container never holds
# it: the gateway does. The App key and model key are secrets of the `agent`
# environment, which only the default branch can use (GA-03's signed stop-gap;
# id-token: write returns with the token-vending function, GA-02).
#
# A flagged task's comment goes on the agent's PR through the App token. If the
# run opened no PR, the separate flag-on-issue job, the only one with issues
# write, posts it on the triggering issue.
name: agent-claude-code

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "New task: the issue to work on"
        type: string
        required: false
        default: ""
      task:
        description: "New task: what the agent should do"
        type: string
        required: false
        default: ""
      pr:
        description: "Re-dispatch: the agent's own PR to continue"
        type: string
        required: false
        default: ""
      note:
        description: "Re-dispatch: an optional note for the agent"
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  preflight:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/agent-preflight.yml
    with:
      target-pr: ${{ inputs.pr }}

  run-agent:
    needs: preflight
    if: needs.preflight.outputs.allowed == 'true'
    concurrency:
      group: ${{ needs.preflight.outputs.concurrency-group }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The App token lives 60 minutes; the task gets 50 of them (plan 6.1).
    timeout-minutes: 60
    environment: agent
    permissions:
      contents: read
      packages: read
      issues: read
      pull-requests: read
    outputs:
      flag-target: ${{ steps.flag.outputs.target }}
    env:
      KIT: .github/agent-kit/runtime
      AGENT_NAME: claude-code
      TASK_ID: run-${{ github.run_id }}-${{ github.run_attempt }}
      MAX_TURNS: "80"
    steps:
      - name: Check out the default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Write the task file
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
          IN_ISSUE: ${{ inputs.issue }}
          IN_TASK: ${{ inputs.task }}
          IN_PR: ${{ inputs.pr }}
          IN_NOTE: ${{ inputs.note }}
          BOT_LOGINS: ${{ vars.AGENT_BOT_LOGINS }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task"
          printf '%s' "$IN_TASK" > "$RUNNER_TEMP/task/request.txt"
          printf '%s' "$IN_NOTE" > "$RUNNER_TEMP/task/note.txt"
          branch=""
          if [ -n "$IN_PR" ]; then
            [[ "$IN_PR" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "::error::pr must be a number"; exit 1; }
            [ -z "$IN_TASK" ] || { echo "::error::a re-dispatch takes a note, not a task"; exit 1; }
            [ -n "$BOT_LOGINS" ] || { echo "::error::AGENT_BOT_LOGINS is not set"; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/pulls/$IN_PR" > "$RUNNER_TEMP/task/pr.json"
            branch=$(python3 "$KIT/sandbox/agent_task.py" pr-branch --pr-json "$RUNNER_TEMP/task/pr.json" \
              --repo "$GITHUB_REPOSITORY" --agent "$AGENT_NAME" --bot "$BOT_LOGINS")
          else
            [[ "$IN_ISSUE" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "::error::a new task needs an issue number"; exit 1; }
            [ -n "$IN_TASK" ] || { echo "::error::a new task needs task text"; exit 1; }
          fi
          python3 "$KIT/sandbox/agent_task.py" task --repo "$GITHUB_REPOSITORY" --agent "$AGENT_NAME" \
            --issue "$IN_ISSUE" --pr "$IN_PR" --branch "$branch" \
            --task-file "$RUNNER_TEMP/task/request.txt" --note-file "$RUNNER_TEMP/task/note.txt" \
            --out "$RUNNER_TEMP/task/task.md"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Load the MCP config from the base commit
        run: |
          set -euo pipefail
          python3 .github/agent-kit/scripts/load_agent_config.py --repo . --base-ref HEAD \
            --dest "$RUNNER_TEMP/agent-config"
          python3 "$KIT/sandbox/agent_task.py" mcp-config --config-dir "$RUNNER_TEMP/agent-config" \
            > "$RUNNER_TEMP/task/mcp.json"

      - name: Build the control image
        run: docker build -q -t runtime-control:dev -f "$KIT/sandbox/docker/control.Dockerfile" "$KIT"

      - name: Pull the agent image and check the CLI and model pair
        env:
          AGENT_IMAGE: ${{ vars.AGENT_IMAGE_WITH_DIGEST }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$AGENT_IMAGE" =~ ^ghcr\.io/owxyz/[a-z0-9-]+@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::AGENT_IMAGE_WITH_DIGEST must be ghcr.io/owxyz/...@sha256:<64 hex>"; exit 1; }
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker pull -q "$AGENT_IMAGE"
          docker logout ghcr.io
          python3 "$KIT/sandbox/agent_pair.py" check --image "$AGENT_IMAGE"

      - name: Mint a one-repo token and store the model key
        env:
          APP_ID: ${{ vars.AGENT_APP_ID }}
          APP_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          MODEL_KEY: ${{ secrets.AGENT_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$APP_ID" ] && [ -n "$APP_KEY" ] && [ -n "$MODEL_KEY" ] \
            || { echo "::error::the agent environment needs AGENT_APP_ID, AGENT_APP_PRIVATE_KEY and AGENT_API_KEY"; exit 1; }
          printf '%s' "$APP_KEY" > "$RUNNER_TEMP/app-key.pem"
          printf '%s' "$MODEL_KEY" > "$RUNNER_TEMP/model-key"
          python3 "$KIT/sandbox/mint_installation_token.py" mint --app-id "$APP_ID" \
            --private-key "$RUNNER_TEMP/app-key.pem" --repo "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/gh-token"
          rm "$RUNNER_TEMP/app-key.pem"

      - name: Run Claude Code in the sandbox
        id: sandbox
        env:
          AGENT_IMAGE: ${{ vars.AGENT_IMAGE_WITH_DIGEST }}
          IN_ISSUE: ${{ inputs.issue }}
          IN_PR: ${{ inputs.pr }}
          BRANCH: ${{ steps.task.outputs.branch }}
        run: |
          set -uo pipefail
          AGENT_MODEL=$(python3 "$KIT/sandbox/agent_pair.py" model)
          echo '{"allow": []}' > "$RUNNER_TEMP/allowlist.json"
          scope=()
          [ -z "$IN_ISSUE" ] || scope+=(--issue "$IN_ISSUE")
          [ -z "$IN_PR" ] || scope+=(--pr "$IN_PR")
          # The script runs in the container; its arguments are data, never spliced into it.
          # shellcheck disable=SC2016
          script='set -e
          git clone -q "https://github.com/$1" /workspace/repo
          cd /workspace/repo
          git config user.name "owxyz-coding-agent[bot]"
          git config user.email "355238002+owxyz-coding-agent[bot]@users.noreply.github.com"
          [ -z "$2" ] || git switch -q "$2"
          exec claude -p "$(cat /task/task.md)" --model "$3" --max-turns "$4" \
            --output-format json --dangerously-skip-permissions --strict-mcp-config --mcp-config "$5"'
          python3 "$KIT/sandbox/runner.py" --task-id "$TASK_ID" --agent "$AGENT_NAME" \
            --image "$AGENT_IMAGE" --allowlist "$RUNNER_TEMP/allowlist.json" \
            --repo "$GITHUB_REPOSITORY" "${scope[@]}" --task-file "$RUNNER_TEMP/task/task.md" \
            --model-key-file "$RUNNER_TEMP/model-key" --github-token-file "$RUNNER_TEMP/gh-token" \
            --ledger "$RUNNER_TEMP/flag-ledger.jsonl" --memory 4g --cpus 2 --timeout 3000 \
            -- sh -c "$script" agent "$GITHUB_REPOSITORY" "$BRANCH" "$AGENT_MODEL" "$MAX_TURNS" \
            "$(cat "$RUNNER_TEMP/task/mcp.json")"
          code=$?
          rm -f "$RUNNER_TEMP/model-key"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ]

      - name: Read the result from the ledger
        id: result
        if: always() && steps.sandbox.outputs.code != ''
        run: |
          set -euo pipefail
          python3 "$KIT/sandbox/agent_task.py" result --ledger "$RUNNER_TEMP/flag-ledger.jsonl" \
            --task-id "$TASK_ID" >> "$GITHUB_OUTPUT"

      - name: Post flags on the agent's PR
        id: flag
        if: always() && steps.result.outputs.flags != '' && steps.result.outputs.flags != '0'
        env:
          PR: ${{ steps.result.outputs.pr }}
        run: |
          set -euo pipefail
          python3 "$KIT/escalation/flag_ledger.py" comment --ledger "$RUNNER_TEMP/flag-ledger.jsonl" \
            --task-id "$TASK_ID" > "$RUNNER_TEMP/flag.md"
          if [ -z "$PR" ]; then
            # No PR to post on: flag-on-issue posts it with the one issues-write token.
            echo "target=issue" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GH_TOKEN=$(cat "$RUNNER_TEMP/gh-token") gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -F "body=@$RUNNER_TEMP/flag.md" --silent
          echo "target=pr" >> "$GITHUB_OUTPUT"

      - name: Revoke the token
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/model-key"
          [ ! -f "$RUNNER_TEMP/gh-token" ] || python3 "$KIT/sandbox/mint_installation_token.py" revoke \
            --token-file "$RUNNER_TEMP/gh-token"
          rm -f "$RUNNER_TEMP/gh-token"

      - name: Keep the flag comment for the issue
        if: always() && steps.flag.outputs.target == 'issue'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flag-comment
          path: ${{ runner.temp }}/flag.md
          retention-days: 7

      # Interim (GA-20 extends it, G1.6 replaces it): the ledger as a job artifact.
      - name: Keep the task ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-ledger
          path: ${{ runner.temp }}/flag-ledger.jsonl
          if-no-files-found: ignore
          retention-days: 30

  flag-on-issue:
    needs: [preflight, run-agent]
    if: always() && needs.run-agent.outputs.flag-target == 'issue'
    # Part of the same run, so it holds the same group; run-agent has released it by now.
    concurrency:
      group: ${{ needs.preflight.outputs.concurrency-group }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Fetch the flag comment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flag-comment
          path: ${{ runner.temp }}/flag

      - name: Post it on the triggering issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "::error::no issue to post the flag on"; exit 1; }
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/flag/flag.md"
