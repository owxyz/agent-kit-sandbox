# P2.10 trigger only. PRs and merge commits can edit this file, so it holds nothing
# and decides nothing: heldout-tests.yml runs from the default branch when this
# completes, for the SHA that GitHub records on this run.
# Install at .github/workflows/.
name: heldout-trigger

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "Held-out tests run from the default branch workflow."
