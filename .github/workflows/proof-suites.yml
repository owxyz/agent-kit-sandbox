name: proof-suites
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions: {}
jobs:
  suite:
    name: proof-suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PASS: ${{ contains(github.event.pull_request.labels.*.name, 'proof-pass') }}
        run: test "$PASS" = true
