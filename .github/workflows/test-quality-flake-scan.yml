# Tracks flake rates for existing tests on the default branch (ticket P2.4).
#
# measure runs the default-branch tests read-only. record never runs tests and is the only job that
# can push, and only to the history branch. Quarantine changes go through a normal owner-reviewed PR.
name: test-quality-flake-scan

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

env:
  HARNESS: .github/agent-kit/test-quality
  HISTORY_BRANCH: test-quality-history # REPLACE if the repo uses another name

jobs:
  measure:
    name: measure
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install project dependencies and harness tools
        run: |
          python3 -m venv "$RUNNER_TEMP/tq-venv"
          if [ -f requirements.txt ]; then
            "$RUNNER_TEMP/tq-venv/bin/pip" install --only-binary=:all: -r requirements.txt
          fi
          "$RUNNER_TEMP/tq-venv/bin/pip" install --only-binary=:all: -r "$HARNESS/requirements-harness.txt"
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          fi
          cp -R "$HARNESS/harness-js" "$RUNNER_TEMP/tq-jest"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/tq-jest"

      - name: Measure the existing suite
        env:
          SHA: ${{ github.sha }}
        run: >-
          python3 "$HARNESS/scripts/flake_tracker.py" measure
          --repo . --sha "$SHA"
          --python "$RUNNER_TEMP/tq-venv/bin/python"
          --jest-bin "$RUNNER_TEMP/tq-jest/node_modules/jest/bin/jest.js"
          --out "$RUNNER_TEMP/flake-results.json"

      - name: Save measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-results
          path: ${{ runner.temp }}/flake-results.json
          if-no-files-found: error

  record:
    name: record
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .trusted
          persist-credentials: false

      - name: Check out the history branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HISTORY_BRANCH }}
          path: history

      - name: Load measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-results
          path: ${{ runner.temp }}/flake

      - name: Update the history and propose quarantine changes
        shell: bash # pipefail, so a tracker error is not hidden by tee
        run: |
          scripts=".trusted/$HARNESS/scripts"
          cp ".trusted/$HARNESS/config/quarantine.json" "$RUNNER_TEMP/quarantine.proposed.json"
          python3 "$scripts/flake_tracker.py" record --db history/flake-history.json --results "$RUNNER_TEMP/flake/flake-results.json"
          python3 "$scripts/flake_tracker.py" quarantine --db history/flake-history.json \
            --quarantine "$RUNNER_TEMP/quarantine.proposed.json" --write | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push the history
        run: |
          cd history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake-history.json
          git diff --cached --quiet || git commit -m "Record flake measurements"
          git push origin "HEAD:$HISTORY_BRANCH"

      - name: Save proposed quarantine list for an owner to commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarantine-proposed
          path: ${{ runner.temp }}/quarantine.proposed.json
          if-no-files-found: error
