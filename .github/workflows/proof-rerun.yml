name: proof-rerun
on:
  pull_request:
permissions: {}
jobs:
  rerun:
    name: proof-rerun
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 40); do
            latest="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/proof-target.yml/runs?head_sha=$HEAD_SHA&per_page=1" \
              --jq '.workflow_runs[0] | "\(.id) \(.status) \(.conclusion)"')"
            read -r run_id status conclusion <<< "$latest"
            echo "target: ${run_id:-none} ${status:-} ${conclusion:-}"
            if [ "$status" = completed ] && [ "$conclusion" = failure ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/rerun-failed-jobs"
              exit 0
            fi
            sleep 10
          done
          exit 1
