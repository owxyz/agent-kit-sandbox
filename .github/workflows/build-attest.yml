# P4.5 on the sandbox: build once on main, sign provenance, verify it.
# No deploy step: there is no cloud target. The verify job proves that a real
# attestation from this workflow verifies with verify_artifact.py, and that a
# tampered copy of the same artifact is refused.
name: build-attest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-attest
  cancel-in-progress: false

env:
  ARTIFACT: calc.tar.gz
  VERIFIER: .github/gates/deploy/verify_artifact.py

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # only to sign the attestation; no environment, so no cloud role trusts it
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: tar -czf "$ARTIFACT" calc.py calc.js
      - name: Record the digest
        id: digest
        run: echo "digest=sha256:$(sha256sum "$ARTIFACT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACT }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calc
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/gates/deploy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calc
      - name: Verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: >-
          python3 "$VERIFIER" "$ARTIFACT" --repo "$GITHUB_REPOSITORY"
          --repo-id "${{ github.repository_id }}"
          --signer-workflow .github/workflows/build-attest.yml --source-ref refs/heads/main
          --source-digest "$GITHUB_SHA" --expected-digest "$EXPECTED_DIGEST"
      - name: A tampered copy must be refused
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$ARTIFACT" tampered.tar.gz
          printf 'x' >> tampered.tar.gz
          if python3 "$VERIFIER" tampered.tar.gz --repo "$GITHUB_REPOSITORY" \
              --signer-workflow .github/workflows/build-attest.yml --source-ref refs/heads/main; then
            echo "::error::a tampered copy verified"
            exit 1
          fi
          echo "tampered copy refused, as expected"
